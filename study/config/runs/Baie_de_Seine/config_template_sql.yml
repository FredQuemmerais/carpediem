      X1_mat_AP: 1
      X2_relation_AP: 1
      X3_var_sensi: 1
      X4_var_ccr_AP: 1
      X5_var_act: 1
      X6_distance: 1
      X7_mat_sensi: 1
      X8_var_hab: 1
      X9_norm_form: 1
      X10_agreg_press: 1
    export_simul: yes
    export_result: yes
    lrepr_activite: no
    lsauv_activite: yes
    lrepr_iq: no
    lsauv_iq: yes
    lrepr_hab_sensib: no
    lsauv_hab_sensib: yes
    lrepr_grid_z: no
    lsauv_grid_z: yes
    daterepr: ''
    daterepr_activite: ''
    daterepr_iq: ''
    daterepr_hab_sensib: ''
    daterepr_grid_z: ''
