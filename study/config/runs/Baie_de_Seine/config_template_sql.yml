project:
  srm: MMN
db:
  enable_postgis: yes
  choice: local
  data_source: postgis
inputs:
  ods:
    act_press: config/matrice_act_press.ods
    sensi_hab_press: config/matrice_sensi_hab_press.ods
Calc:
  agreg_sensib: 1
  th_sensib: 20.0
  l_corr_surfhab: yes
Outputs:
  write_maps: yes
  verbose_maps: no
  export_details: yes
  export_db: yes
  export_db_details: yes
  export_maps_Ai: yes
  export_maps_Pj: yes
  export_maps_REX_Pj: yes
datasets:
- Table_code: grid
  enabled: yes
  Data_type: G
  Source: postgis
  id_col: id2
  geom_col: geom
  srm_col: srm
  surfmesh_col: surf_cel
  surfmer_col: surfmer
  DB_schema: bds_activites
  DB_table: grille_carpediem_1m_2154
- Table_code: grid_zone
  enabled: no
  Data_type: G
  Source: postgis
  id_col: id2
  geom_col: geom
  surfmesh_col: surf_cel
  surfmer_col: surfmer
  zone_col: zone
  DB_schema: bds_activites
  DB_table: gr_stat_zone_2154
- Table_code: habbenth
  enabled: yes
  Data_type: E
  Source: postgis
  id_col: id2
  geom_col: geom
  surfmesh_col: surf_cel
  surfmer_col: surfmer
  surfhab_col: surfhab_cel
  habcode_col: cod_eunis
  DB_schema: bds_activites
  DB_table: hab_2154
- Table_code: aquaculture
  enabled: yes
  Source: postgis
  id_col: id2
  geom_col: geom
  DB_schema: bds_activites
  DB_table: act_aquaculture_2154
  Data_type: A
  intensity_cols:
  - i_pcml
  - i_af
  - i_cs
  - i_cmf
  - i_cmib
  - i_oit
  - i_clm
- Table_code: artificialisation
  enabled: yes
  Source: postgis
  id_col: id2
  geom_col: geom
  DB_schema: bds_activites
  DB_table: act_artif_2154
  Data_type: A
  intensity_cols: long_art
- Table_code: chalutage
  enabled: yes
  Source: postgis
  id_col: id2
  geom_col: geom
  DB_schema: bds_activites
  DB_table: act_chalut_2154
  Data_type: A
  intensity_cols:
  - nbh_cha_fon_moy
  - nbh_cha_per_moy
  - nbh_cha_pel_moy
- Table_code: clapage
  enabled: yes
  Source: postgis
  id_col: id2
  geom_col: geom
  DB_schema: bds_activites
  DB_table: act_clapage_2154
  Data_type: A
  intensity_cols: i_rmc
- Table_code: drague
  enabled: yes
  Source: postgis
  id_col: id2
  geom_col: geom
  DB_schema: bds_activites
  DB_table: act_drague_2154
  Data_type: A
  intensity_cols: nbh_dra_moy
- Table_code: dragage_port
  enabled: yes
  Source: postgis
  id_col: id2
  geom_col: geom
  DB_schema: bds_activites
  DB_table: act_dragage_port_2154
  Data_type: A
  intensity_cols: i_dpcn
- Table_code: extraction
  enabled: yes
  Source: postgis
  id_col: id2
  geom_col: geom
  DB_schema: bds_activites
  DB_table: act_extraction_2145
  Data_type: A
  intensity_cols: i_emm
- Table_code: navigation
  enabled: yes
  Source: postgis
  id_col: id2
  geom_col: geom
  DB_schema: bds_activites
  DB_table: act_nav_2154
  Data_type: A
  intensity_cols: nav2012
- Table_code: nutriment
  enabled: yes
  Source: postgis
  id_col: id2
  geom_col: geom
  DB_schema: bds_activites
  DB_table: act_nutriment_2145
  Data_type: A
  intensity_cols:
