    enabled: yes
    scenarios:
      X1_mat_AP:
      - 2
      - 3
      - 4
      X2_relation_AP:
      - 2
      - 3
      - 4
      - 5
      X7_mat_sensi:
      - 2
      - 3
      X6_distance:
      - 0
      - 1
      X9_norm_form:
      - 2
      - 3
      - 4
      X10_agreg_press:
      - 2
      - 3
      - 4
  robustesse_stoch:
    enabled: yes
  sensibilite_formelle:
    enabled: yes
    methode: shapley
    m: 100
    nrep: 10
    facteurs:
      X1_mat_AP:
      - 2
      - 3
      - 4
      X2_relation_AP:
      - 2
      - 3
      - 4
      - 5
      X3_var_sensi:
      - 0
      - 1
      X4_var_ccr_AP:
      - 0
      - 1
      X5_var_act:
      - 0
      - 1
      X6_distance:
      - 0
      - 1
      X7_mat_sensi:
      - 2
      - 3
      X8_var_hab:
      - 0
      - 1
      X9_norm_form:
      - 2
      - 3
      - 4
      X10_agreg_press:
      - 2
      - 3
      - 4
