apiVersion: v2
name: carpediem
description: >-
  Carpediem maps the risk of cumulative effects (RCE) of human activities on benthic
  habitats, a key input of Cumulative Effects Assessments for ecosystem-based Maritime
  Spatial Planning. It crosses benthic habitats and their sensitivity to pressures with the
  distribution and intensity of human activities and the pressures they generate, and
  produces a confidence index and, through Monte Carlo simulations, a measure of
  variability. Developed by Quemmerais-Amice et al. (2020) during the Carpediem project
  (France, Marine Strategy Framework Directive), it builds on Halpern et al. (2008).
  Example dataset: North Sea (Norsaic). Contact: antonin.gimard@cerema.fr,
  frederic.quemmerais-amice@ofb.gouv.fr
icon: https://www.frontiersin.org/api/ipx/f=webp/https://www.frontiersin.org/files/Articles/1800336/xml-images/focsu-04-1800336-g0001.webp
home: https://github.com/FredQuemmerais/carpediem/tree/carpediem_v2
sources:
  - https://github.com/FredQuemmerais/carpediem/tree/carpediem_v2
keywords:
